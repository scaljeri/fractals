<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lorenz attractor · calje</title>
<link rel="icon" href="../../favicon.ico" sizes="any" />
<link rel="stylesheet" href="../../assets/css/colors_and_type.css" />
<link rel="stylesheet" href="../../assets/css/site.css" />
<link rel="stylesheet" href="../utils/viewer.css" />
</head>
<body data-fractal-id="lorenz">

<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<header id="brand-bar">
  <a href="../../index.html" title="back to the fractal atlas (home)">← atlas</a>
  <span class="sep">·</span>
  <span class="label" id="brand-fractal-name">—</span>
  <button id="info-btn" class="info-btn" title="about this fractal" aria-label="info">i</button>
</header>

<a class="gh-corner-pill" href="https://github.com/scaljeri/fractals"
   target="_blank" rel="noopener noreferrer"
   title="View source on GitHub">
  <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
    <path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8a8 8 0 0 0-8-8Z"/>
  </svg>
  <span>github</span>
</a>

<button id="handle" class="menu-handle" title="toggle menu (m)" aria-label="toggle menu">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
    <path d="M3 4h10M3 8h10M3 12h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
</button>

<aside id="menu" class="menu">
  <div class="menu__head">
    <div class="menu__crumbs">
      <span id="crumbIdx">01</span> / 12
    </div>
    <h1 id="title" class="menu__title">—</h1>
    <p id="desc" class="menu__desc">—</p>
    <code id="formula" class="menu__formula"></code>
  </div>

  <div class="menu__section">
    <div id="paletteRow" class="menu__row">
      <span class="label">palette</span>
      <div id="swatches" class="swatches"></div>
    </div>
    <div id="variantRow" class="menu__row" style="display:none; margin-top:8px;">
      <span class="label">variant</span>
      <select id="variantSelect" class="variant-select"></select>
    </div>
  </div>

  <div class="menu__section">
    <div class="stat-row">
      <span>render <b id="renderTime">—</b></span>
      <span>iter <b id="iterMax">—</b></span>
      <span>cpus <b id="cpus">—</b></span>
    </div>
  </div>

  <div class="menu__section">
    <div class="cta-row">
      <button id="diveBtn"  class="pill" title="continuous endless zoom — click again, press space, or click the canvas to stop"><span>▶ dive</span><span style="color:var(--fg-subtle);margin-left:auto">space</span></button>
      <button id="resetBtn" class="pill"><span>reset view</span></button>
      <button id="shotBtn"  class="pill"><span>save PNG</span><span style="color:var(--fg-subtle);margin-left:auto">⌃⇧C</span></button>
    </div>
  </div>

  <div class="menu__section">
    <div class="legend">
      <kbd class="key">m</kbd><span>menu</span>
      <span class="sep">·</span>
      <kbd class="key">click</kbd><span>zoom in</span>
      <span class="sep">·</span>
      <kbd class="key">shift-click</kbd><span>zoom out</span>
      <span class="sep">·</span>
      <kbd class="key">space</kbd><span>dive</span>
      <span class="sep">·</span>
      <kbd class="key">←</kbd><kbd class="key">→</kbd><span>navigate</span>
      <span class="sep">·</span>
      <kbd class="key">esc</kbd><span>atlas</span>
      <span class="sep">·</span>
      <kbd class="key">p</kbd><span>cycle palette</span>
    </div>
  </div>
</aside>

<div id="progress" style="--p:0%"></div>
<div id="toast" class="toast">—</div>

<script src="../utils/fractal-info.js"></script>
<script src="../utils/fractals.js"></script>
<script src="../utils/palette.js"></script>
<script src="../utils/canvas.js"></script>
<script src="../utils/webgpu-device.js"></script>
<script src="../utils/webgpu-palette.js"></script>
<script src="../utils/escape-time-worker.js"></script>
<script src="../utils/renderers/gpu/escape-time-gpu.js"></script>
<script src="../utils/renderers/gpu/ifs-gpu.js"></script>
<script src="../utils/renderers/gpu/lsystem-gpu.js"></script>
<script src="../utils/renderers/gpu/subdivision-gpu.js"></script>
<script src="./ode-gpu.js"></script>
<script src="../utils/renderers/escape-time.js"></script>
<script src="../utils/renderers/ifs.js"></script>
<script src="../utils/renderers/lsystem.js"></script>
<script src="../utils/renderers/subdivision.js"></script>
<script src="./ode.js"></script>
<script src="../utils/fractal-viewer.js"></script>
</body>
</html>
