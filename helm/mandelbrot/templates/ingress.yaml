{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mandelbrot.fullname" . }}
  labels:
    {{- include "mandelbrot.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- if .Values.jetson.externalHost }}
    # Strip the /gpu prefix before forwarding to the Jetson backend so it sees
    # its normal paths (/render, /jobs/…, /download/…).
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-strip-gpu@kubernetescrd" .Release.Namespace (include "mandelbrot.fullname" .) }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.hostname | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.hostname | quote }}
      http:
        paths:
          {{- if .Values.jetson.externalHost }}
          - path: /gpu
            pathType: Prefix
            backend:
              service:
                name: {{ include "mandelbrot.fullname" . }}-jetson
                port:
                  number: {{ .Values.jetson.externalPort }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mandelbrot.fullname" . }}-frontend
                port:
                  number: {{ .Values.service.port }}
{{- end }}
