{{- if and .Values.ingress.enabled .Values.jetson.externalHost }}
# Traefik middleware to strip the /gpu prefix before forwarding to the Jetson,
# so the backend sees /render, /jobs/…, /download/… at its normal paths.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "mandelbrot.fullname" . }}-strip-gpu
  labels:
    {{- include "mandelbrot.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /gpu
{{- end }}
