# values.yaml — override via -f custom-values.yaml on `helm install`.

# DNS name served by the Ingress.
hostname: mandelbrot.calje.eu

image:
  repository: ghcr.io/luca/mandelbrot
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80

jetson:
  # External URL where the Jetson render service is reachable from the cluster
  # (LAN IP, Tailscale address, or tunnel endpoint). `/gpu/*` in the ingress
  # strips the prefix and forwards here.
  #
  # Leave empty to disable the /gpu route (the frontend auto-hides the button
  # when it can't reach the service).
  externalHost: ""     # e.g. "jetson.tail-xyz.ts.net" or "10.0.0.42"
  externalPort: 8080
  externalScheme: http # http or https

ingress:
  enabled: true
  className: traefik
  annotations: {}
  tls:
    enabled: true
    # Name of a cert-manager ClusterIssuer. Leave empty to skip TLS.
    clusterIssuer: letsencrypt-prod
    # Secret that will be populated with the issued certificate.
    secretName: mandelbrot-tls

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 20m
    memory: 32Mi

nodeSelector: {}
tolerations: []
affinity: {}
