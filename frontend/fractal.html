<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fractal · viewer</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="stylesheet" href="assets/css/colors_and_type.css" />
<link rel="stylesheet" href="assets/css/site.css" />
<style>
  html, body { height: 100%; overflow: hidden; }
  #stage {
    position: fixed; inset: 0;
    background: #050605;
    cursor: crosshair;
  }
  #canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    background: #000;
    image-rendering: pixelated;
  }
  #canvas.smooth { image-rendering: auto; }

  /* faint scanlines for atmosphere */
  #stage::after {
    content: ""; position: absolute; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 1px, rgba(0,0,0,0.18) 1px 2px);
    mix-blend-mode: multiply;
    opacity: 0.28;
    z-index: 2;
  }
  .menu { width: 360px; }
  .stat-row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-subtle);
  }
  .stat-row b { color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }

  #progress {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 1px;
    background: linear-gradient(to right, var(--accent) var(--p,0%), transparent var(--p,0%));
    transition: opacity var(--dur-base) var(--ease-out);
    opacity: 0;
    pointer-events: none;
    z-index: 11;
  }
  #progress.busy { opacity: 0.9; }

  /* ---------- permanent top-left brand bar (mirrors mandelbrot.html) ---------- */
  #brand-bar {
    position: fixed;
    top: var(--s-4); left: var(--s-4);
    z-index: 12;
    display: inline-flex; align-items: center; gap: var(--s-2);
    height: 28px;
    padding: 0 12px;
    background: rgba(10, 10, 10, 0.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg-muted);
    box-sizing: border-box;
  }
  #brand-bar a {
    color: var(--accent);
    text-decoration: none;
  }
  #brand-bar a:hover { color: var(--accent-dim); }
  #brand-bar .sep   { color: var(--fg-faint); margin: 0 2px; }
  #brand-bar .label { color: var(--fg); }
  .info-btn {
    appearance: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-muted);
    width: 18px; height: 18px;
    border-radius: 50%;
    cursor: pointer;
    font-family: 'Times New Roman', serif;
    font-style: italic;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    padding: 0;
    margin-left: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background var(--dur-fast) var(--ease-out),
                color var(--dur-fast) var(--ease-out),
                border-color var(--dur-fast) var(--ease-out);
  }
  .info-btn:hover {
    background: var(--ink-2);
    border-color: var(--accent);
    color: var(--accent);
  }
  /* Push the menu handle AND the aside panel down so they sit below the
     brand bar (which is top:16, height 28 → ends at y=44). */
  #handle.menu-handle { top: 56px; }
  #menu.menu { top: 56px; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<header id="brand-bar">
  <a href="index.html" title="back to the fractal atlas (home)">← atlas</a>
  <span class="sep">·</span>
  <span class="label" id="brand-fractal-name">—</span>
  <button id="info-btn" class="info-btn" title="about this fractal" aria-label="info">i</button>
</header>

<button id="handle" class="menu-handle" title="toggle menu (m)" aria-label="toggle menu">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
    <path d="M3 4h10M3 8h10M3 12h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
</button>

<aside id="menu" class="menu">
  <div class="menu__head">
    <div class="menu__crumbs">
      <span id="crumbIdx">01</span> / 12
    </div>
    <h1 id="title" class="menu__title">—</h1>
    <p id="desc" class="menu__desc">—</p>
    <code id="formula" class="menu__formula"></code>
  </div>

  <div class="menu__section">
    <div id="paletteRow" class="menu__row">
      <span class="label">palette</span>
      <div id="swatches" class="swatches"></div>
    </div>
  </div>

  <div class="menu__section">
    <div class="stat-row">
      <span>render <b id="renderTime">—</b></span>
      <span>iter <b id="iterMax">—</b></span>
      <span>cpus <b id="cpus">—</b></span>
    </div>
  </div>

  <div class="menu__section">
    <div class="cta-row">
      <button id="diveBtn"  class="pill" title="continuous endless zoom — click again, press space, or click the canvas to stop"><span>▶ dive</span><span style="color:var(--fg-subtle);margin-left:auto">space</span></button>
      <button id="resetBtn" class="pill"><span>reset view</span></button>
      <button id="shotBtn"  class="pill"><span>save PNG</span><span style="color:var(--fg-subtle);margin-left:auto">⌃⇧C</span></button>
    </div>
  </div>

  <div class="menu__section">
    <div class="legend">
      <kbd class="key">m</kbd><span>menu</span>
      <span class="sep">·</span>
      <kbd class="key">click</kbd><span>zoom in</span>
      <span class="sep">·</span>
      <kbd class="key">shift-click</kbd><span>zoom out</span>
      <span class="sep">·</span>
      <kbd class="key">space</kbd><span>dive</span>
      <span class="sep">·</span>
      <kbd class="key">←</kbd><kbd class="key">→</kbd><span>navigate</span>
      <span class="sep">·</span>
      <kbd class="key">esc</kbd><span>atlas</span>
      <span class="sep">·</span>
      <kbd class="key">p</kbd><span>cycle palette</span>
    </div>
  </div>
</aside>

<div id="progress" style="--p:0%"></div>
<div id="toast" class="toast">—</div>

<script src="assets/js/fractal-info.js"></script>
<script src="assets/js/fractals.js"></script>
<script src="assets/js/shared/palette.js"></script>
<script src="assets/js/shared/canvas.js"></script>
<script src="assets/js/shared/webgpu-device.js"></script>
<script src="assets/js/shared/webgpu-palette.js"></script>
<script src="assets/js/shared/escape-time-worker.js"></script>
<script src="assets/js/renderers/gpu/escape-time-gpu.js"></script>
<script src="assets/js/renderers/gpu/ifs-gpu.js"></script>
<script src="assets/js/renderers/gpu/lsystem-gpu.js"></script>
<script src="assets/js/renderers/gpu/subdivision-gpu.js"></script>
<script src="assets/js/renderers/gpu/ode-gpu.js"></script>
<script src="assets/js/renderers/escape-time.js"></script>
<script src="assets/js/renderers/ifs.js"></script>
<script src="assets/js/renderers/lsystem.js"></script>
<script src="assets/js/renderers/subdivision.js"></script>
<script src="assets/js/renderers/ode.js"></script>
<script src="assets/js/fractal-viewer.js"></script>
</body>
</html>
