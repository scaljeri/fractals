# Local dev: one container running Caddy that serves the frontend and
# reverse-proxies /gpu/* to the Jetson render service.
#
# Run:
#   docker compose up -d                                           # default: proxy to host.docker.internal:8080
#   JETSON_URL=http://10.0.0.42:8080 docker compose up -d           # real Jetson on LAN
#   JETSON_URL=http://jetson.tail-xyz.ts.net:8080 docker compose up # via Tailscale
#
# Open http://localhost:8080 in the browser.

services:
  mandelbrot:
    image: caddy:2-alpine
    container_name: mandelbrot
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Bind-mount the source so changes are picked up without rebuild.
      - ./frontend:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy writes a tiny data dir; keep it in a named volume so restarts don't re-run TLS.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Override in shell or .env to point at a real Jetson. On Mac/Windows,
      # `host.docker.internal` resolves to the host; on Linux you may need to
      # use `--add-host host.docker.internal:host-gateway` or an explicit IP.
      JETSON_URL: "${JETSON_URL:-http://host.docker.internal:8080}"

volumes:
  caddy_data:
  caddy_config:
